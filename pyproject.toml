[build-system]
requires = ["poetry-core>=1.8"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "bpilot"
version = "0.1.0"
description = "Intelligent backport helper for git repositories"
license = "Apache-2.0"
authors = ["bpilot maintainers"]
readme = "README.md"
packages = [{ include = "bpilot", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10"
httpx = ">=0.27"
PyYAML = ">=6.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
pytest-cov = ">=5"
ruff = ">=0.5"

[tool.poetry.scripts]
bpilot = "bpilot.cli:main"

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["bpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
