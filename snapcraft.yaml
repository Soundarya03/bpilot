name: bpilot
base: core24
version: 0.1.0
summary: Intelligent backport helper for git repositories
description: |
  bpilot automates the mechanical parts of backporting changes between git
  branches (fetch, branch, cherry-pick) and provides an LLM-assisted layer
  for conflict resolution and semantic gap analysis. The LLM is a pure
  text-in/text-out function; only the git-ops layer ever mutates the repo.

  Configure via `snap set bpilot openrouter-api-key=...` or the
  OPENROUTER_API_KEY environment variable.

grade: devel
confinement: classic

apps:
  bpilot:
    command: bin/python3 $SNAP/bin/bpilot

parts:
  bpilot:
    plugin: poetry
    source: .
    source-type: git
    build-packages:
      - python3.12
      - python3.12-venv
    stage-packages:
      - python3.12-minimal
      - libpython3.12-minimal
      - libpython3.12-stdlib
      # Bundle git so the snap is self-contained under classic confinement.
      - git
